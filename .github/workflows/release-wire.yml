name: Release wire

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - packages/wire/**
      - packages/wire-core/**
      - packages/provider-asana/**
      - packages/provider-chatgpt/**
      - packages/provider-gmail/**
      - packages/provider-google-docs/**
      - packages/provider-lattice/**
      - packages/provider-notion/**
      - packages/provider-slack/**
      - packages/provider-zoom/**
      - .github/workflows/release-wire.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npm run check
      - run: npm pack --workspace @kamilio/wire --json --pack-destination "$RUNNER_TEMP"
      - working-directory: packages/wire
        run: |
          remote=$(npm view @kamilio/wire version)
          npm version --no-git-tag-version --allow-same-version "$remote"
          for attempt in 1 2; do
            npm version --no-git-tag-version patch
            version=$(node -p "require('./package.json').version")
            if npm publish --access public > "$RUNNER_TEMP/wire-publish.log" 2>&1; then
              cat "$RUNNER_TEMP/wire-publish.log"
              exit 0
            else
              status=$?
            fi
            cat "$RUNNER_TEMP/wire-publish.log" >&2
            # npm view omits staged versions, but the registry reserves their numbers.
            if [[ $attempt == 2 ]] ||
               ! grep -Fxq 'npm error code E409' "$RUNNER_TEMP/wire-publish.log" ||
               ! grep -Fxq "npm error 409 Conflict - PUT https://registry.npmjs.org/@kamilio%2fwire - Cannot publish over previously staged version \"$version\"." "$RUNNER_TEMP/wire-publish.log"; then
              exit "$status"
            fi
          done
